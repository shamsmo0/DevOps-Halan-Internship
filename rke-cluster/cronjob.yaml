apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-cronjob
  namespace: sun
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never

          containers:
            - name: cron-test
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  echo "CronJob started"
                  echo "Time: $(date)"
                  echo "CronJob completed"
