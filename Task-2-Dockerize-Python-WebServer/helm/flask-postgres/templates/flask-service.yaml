apiVersion: v1
kind: Service

metadata:
  name: {{ include "flask-postgres.fullname" . }}-flask

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ include "flask-postgres.fullname" . }}-flask

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
