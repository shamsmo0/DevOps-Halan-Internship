name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task-2-Dockerize-Python-WebServer
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t myapp:test ./Task-2-Dockerize-Python-WebServer

  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t myapp:test .

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  container-test:
    name: Container Health Check
    runs-on: ubuntu-latest
    needs:
      - trivy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t myapp:test .

      - name: Run container
        run: docker run -d --name myapp -p 5000:5000 myapp:test

      - name: Wait for application
        run: sleep 5

      - name: Health check
        run: curl --fail http://localhost:5000/health

      - name: Stop container
        if: always()
        run: docker stop myapp

      - name: Remove container
        if: always()
        run: docker rm myapp

